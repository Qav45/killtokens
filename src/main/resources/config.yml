# Tokens awarded per player kill
kill-reward: 1
# Tokens required to cash out
cash-tokens: 10
# Money deposited per cash-out
cash-amount: 100.0
# Display name of the physical token item (supports & color codes)
token-item-name: "&6Kill Token"
# Title of the central /tokens GUI (supports & color codes)
gui-title: "&8&lInstellar Storage"

# Dupe / spam protection
security:
  # Minimum delay (milliseconds) between economy actions per player.
  # Also absorbs the duplicate rapid clicks Bedrock clients send through Geyser.
  action-cooldown-ms: 300

# Refined Ore System
refined:
  # Accept pre-1.2 refined items that only carry a display name (no invisible tag).
  # Name-only matching can be forged with an anvil rename, so set this to false
  # once players have re-stored their old items.
  accept-legacy-items: true
  # denominator (1/85 base)
  ore-chance: 85
  # guaranteed after this many misses
  ore-pity: 100
  # denominator (1/3500 base)
  compressed-chance: 3500
  # guaranteed after this many misses
  compressed-pity: 5000
  broadcast-drops: true
  skip-silk-touch: true
  refined-item: BLUE_DYE
  compressed-item: DIAMOND_NAUTILUS_ARMOR

# Refined U Shop - /refinedu opens a built-in shop GUI with section tabs.
# Each section becomes a tab; each item is a buy button.
# Costs can mix: refined, compressed, tokens, money (Vault), and items
# (physical items taken from the inventory, matched by material + display name;
# unnamed item costs only match plain unenchanted items).
# Optional per item: name, lore, amount, enchantments, unbreakable, glow,
# commands (run as console, {player} placeholder), give-item: false
# (commands only, no item handed over).
