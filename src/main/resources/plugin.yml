name: KillTokens
version: 1.2.0
main: com.example.killtokens.KillTokensPlugin
api-version: 1.20
description: Earn tokens for kills and exchange them for currency.
softdepend: [Vault, PlaceholderAPI, Shopkeepers]

commands:
  tokens:
    description: Manage your kill tokens.
    usage: /<command> [gui|balance|withdraw|cashout|set|add|remove]
    permission: killtokens.use
  refined:
    description: Manage your Refined Ore storage.
    usage: /refined <balance|storage|store|withdraw>
    permission: killtokens.refined
  refinedu:
    description: Open the merged Refined U Shopkeepers GUI.
    usage: /refinedu
    permission: killtokens.refinedu

permissions:
  killtokens.use:
    description: Allows players to use basic token commands.
    default: true
  killtokens.admin:
    description: Allows administrators to set, add, and remove tokens for other players.
    default: op
  killtokens.refined:
    description: Allows players to use /refined commands.
    default: true
  killtokens.refinedu:
    description: Allows players to open the merged Refined U shop.
    default: true
  killtokens.refined.admin:
    description: Admin overrides for refined ore.
    default: op
  killtokens.alerts:
    description: Receives dupe protection flag warnings.
    default: op
